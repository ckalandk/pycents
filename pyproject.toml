[project]
name = "pycents"
version = "1.2.0"
description = "A strongly typed money and currency library for ISO 4217 and custom currencies"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Khaled Kessoum", email = "ckalandk.main@gmail.com"}
]

requires-python = ">=3.12"
dependencies = [
    "typing-extensions>=4.16.0",
]

keywords = [
    "money",
    "currency",
    "finance",
    "iso4217",
    "fintech",
    "i18n",
    "localization",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ckalandk/pycents"
Documentation = "https://pycents.readthedocs.io/"
Repository = "https://github.com/ckalandk/pycents.git"
"Bug Tracker" = "https://github.com/ckalandk/pycents/issues"
"Changelog" = "https://github.com/ckalandk/pycents/releases"

[project.optional-dependencies]
babel = [
    "babel>=2.18.0",
]
pyicu = [
    "pyicu>=2.16.2; sys_platform != 'win32'",
]

i18n = ["babel", "pyicu"]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "hypothesis>=6.161.8",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "sphinx>=9.1.0",
    "sphinx-design>=0.7.0",
    "sphinx-hoverxref>=1.4.2",
    "sphinx-rtd-theme>=3.1.0",
    "tox>=4.58.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "slow: slow tests that may be skipped during normal development",
]

# Test Coverage Configuration
[tool.coverage.run]
source = ["src/pycents"]
omit = [
    "src/pycents/iso4217.py",
    "src/pycents/rounding.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "@abstractmethod"
]

# Ruff Configuration

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
exclude = ["scripts"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (automatically sorts your imports!)
    "B",   # flake8-bugbear (catches common bugs)
    "UP",  # pyupgrade (upgrades syntax to newer Python versions)
]

ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
files = ["src/pycents"]
exclude = [
    "pyicu\\.py$",
    "babel\\.py$"
]
strict = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "icu",
    "icu.*"
]
ignore_missing_imports = true
